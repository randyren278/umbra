cx="93.1" cy="632.2" r="1" fill="#ffffff" fill-opacity="0.29"/><circle cx="145.7" cy="990.3" r="1" fill="#ffffff" fill-opacity="0.22"/><circle cx="373.3" cy="900.1" r="1.6" fill="#ffffff" fill-opacity="0.55"/><circle cx="358.8" cy="688.6" r="0.8" fill="#ffffff" fill-opacity="0.20"/><circle cx="307.0" cy="423.3" r="1.6" fill="#ffffff" fill-opacity="0.27"/><circle cx="483.9" cy="968.0" r="1.2" fill="#ffffff" fill-opacity="0.38"/><circle cx="543.8" cy="1575.6" r="1" fill="#ffffff" fill-opacity="0.25"/><circle cx="333.7" cy="1376.4" r="0.8" fill="#ffffff" fill-opacity="0.28"/><circle cx="537.1" cy="341.6" r="0.8" fill="#ffffff" fill-opacity="0.18"/><circle cx="249.7" cy="413.5" r="0.8" fill="#ffffff" fill-opacity="0.23"/><circle cx="225.5" cy="929.2" r="1" fill="#ffffff" fill-opacity="0.19"/><circle cx="94.6" cy="734.8" r="1.2" fill="#ffffff" fill-opacity="0.45"/><circle cx="408.6" cy="948.8" r="1" fill="#ffffff" fill-opacity="0.42"/>
  <text x="48" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#f4efe6">How Umbra works</text>

  <rect x="48" y="108" width="504" height="176" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.16"/>
  <rect x="48" y="134" width="5" height="34" rx="2.5" fill="#f6b26b"/>
  <text x="76" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="600" fill="#f4efe6">umbra, umbra mcp</text>
  <text x="76" y="204" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">your shell, or every command</text><text x="76" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">as a tool in Claude Code, Codex</text>
  <rect x="48" y="354" width="504" height="212" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.16"/>
  <rect x="48" y="380" width="5" height="34" rx="2.5" fill="#f6b26b"/>
  <text x="76" y="408" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#f4efe6">Daemon</text>
  <text x="76" y="450" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">one per profile</text><text x="76" y="486" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">starts on first use</text><text x="76" y="522" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">exits after 15 idle min</text>
  <rect x="48" y="636" width="504" height="212" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.16"/>
