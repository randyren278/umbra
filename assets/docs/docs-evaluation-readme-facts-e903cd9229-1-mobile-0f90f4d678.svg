<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="600" height="550" role="img" aria-labelledby="title desc">
  <title id="title">Runtime release: October 23, 2026</title>
  <desc id="desc">1.32–1.47× throughput and about 82–84% lower sampled peak memory in three matched single-worker fixture repeats. The final build also cut observation-response tokens by 51.5–57.9% with exact reconstruction through all three transports, and passed semantic ownership/fairness/cancellation checks through 32 clients.</desc>
  <defs>
  <radialGradient id="corona" cx="0" cy="0" r="230" gradientUnits="userSpaceOnUse">
    <stop offset="0.60" stop-color="#dce7ff" stop-opacity="0"/>
    <stop offset="0.655" stop-color="#e8edff" stop-opacity="1"/>
    <stop offset="0.70" stop-color="#93b4ff" stop-opacity="0.7"/>
    <stop offset="0.82" stop-color="#b5a1ff" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#7c83f6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rays" cx="0" cy="0" r="262" gradientUnits="userSpaceOnUse">
    <stop offset="0.56" stop-color="#e8edff" stop-opacity="0.75"/>
    <stop offset="0.72" stop-color="#93b4ff" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#b5a1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moon" cx="-40" cy="-50" r="190" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#192039"/>
    <stop offset="1" stop-color="#080b14"/>
  </radialGradient>
  <radialGradient id="bead" cx="0" cy="0" r="46" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.18" stop-color="#edf3ff"/>
    <stop offset="0.45" stop-color="#bbceff" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#93b4ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7c83f6" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#7c83f6" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="2.6"/>
  </filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#151c30"/>
    <stop offset="1" stop-color="#080b14"/>
  </linearGradient>
  </defs><rect width="600" height="550" rx="28" fill="url(#sky)"/><rect x="0.75" y="0.75" width="598.5" height="548.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/><text x="36" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#93b4ff" data-max-width="528">Runtime release: October</text><text x="36" y="106" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#93b4ff" data-max-width="528">23, 2026</text><text x="36" y="164" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">1.32–1.47× throughput and about</text><text x="36" y="199" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">82–84% lower sampled peak memory</text><text x="36" y="234" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">in three matched single-worker</text><text x="36" y="269" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">fixture repeats. The final build</text><text x="36" y="304" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">also cut observation-response</text><text x="36" y="339" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">tokens by 51.5–57.9% with exact</text><text x="36" y="374" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">reconstruction through all three</text><text x="36" y="409" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">transports, and passed semantic</text><text x="36" y="444" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">ownership/fairness/cancellation</text><text x="36" y="479" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">checks through 32 clients.</text>
