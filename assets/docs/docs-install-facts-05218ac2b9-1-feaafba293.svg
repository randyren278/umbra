<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 271" width="1200" height="271" role="img" aria-labelledby="title desc">
  <title id="title">Teach your agent</title>
  <desc id="desc">In the agent eval, with nothing about the skill in the task prompt (only the standing AGENTS.md rule that names it), Codex read the installed skill in all 14 runs.</desc>
