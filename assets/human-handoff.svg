<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Sign-in and handoff</title>
  <desc id="desc">A person signs in through a visible window, storing the sign-in in Umbra's profile. The agent works in an invisible tab with that profile. If a human step such as two-factor authentication is needed, handoff shows the agent's tab briefly, then hides it again.</desc>
  <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#151c30"/><stop offset="1" stop-color="#080b14"/></linearGradient></defs>
  <rect width="1200" height="440" rx="28" fill="url(#sky)"/><rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="#e8edff" stroke-opacity=".14" stroke-width="2"/>
  <text x="48" y="70" fill="#f1f4fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600">A human enters only when needed</text>
  <text x="48" y="111" fill="#c2cadd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25">The profile keeps your sign-in; handoff keeps the agent's tab.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(48 153)"><rect width="350" height="204" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#93b4ff" stroke-opacity=".55" stroke-width="2"/><rect x="25" y="26" width="52" height="42" rx="8" fill="none" stroke="#93b4ff" stroke-width="3"/><path d="M25 38h52" stroke="#93b4ff" stroke-width="3"/><text x="93" y="57" fill="#f1f4fc" font-size="29" font-weight="600">Sign in once</text><text x="25" y="119" fill="#c2cadd" font-size="24">You enter credentials in</text><text x="25" y="153" fill="#c2cadd" font-size="24">a visible window.</text></g>
    <g transform="translate(425 153)"><rect width="350" height="204" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#b5a1ff" stroke-opacity=".55" stroke-width="2"/><circle cx="50" cy="47" r="25" fill="#edf3ff"/><circle cx="45" cy="52" r="25" fill="#151c30"/><text x="93" y="57" fill="#f1f4fc" font-size="29" font-weight="600">Agent works</text><text x="25" y="119" fill="#c2cadd" font-size="24">The signed-in tab stays</text><text x="25" y="153" fill="#c2cadd" font-size="24">off screen.</text></g>
    <g transform="translate(802 153)"><rect width="350" height="204" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#87dced" stroke-opacity=".55" stroke-width="2"/><circle cx="51" cy="47" r="23" fill="none" stroke="#87dced" stroke-width="3"/><path d="m42 47 7 7 14-16" fill="none" stroke="#87dced" stroke-width="3"/><text x="93" y="57" fill="#f1f4fc" font-size="29" font-weight="600">Handoff</text><text x="25" y="119" fill="#c2cadd" font-size="24">You handle 2FA or a</text><text x="25" y="153" fill="#c2cadd" font-size="24">challenge; it hides again.</text></g>
  </g>
  <g stroke="#93b4ff" stroke-width="3" fill="#93b4ff"><path d="M401 254h17"/><path d="m418 254-8-5v10z"/><path d="M778 254h17"/><path d="m795 254-8-5v10z"/></g>
  <path d="M81 392h1038" stroke="#b5a1ff" stroke-opacity=".6" stroke-width="2"/><circle cx="81" cy="392" r="5" fill="#b5a1ff"/><circle cx="1119" cy="392" r="5" fill="#b5a1ff"/>
  <text x="600" y="422" text-anchor="middle" fill="#c2cadd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22">The agent's tab stays live through handoff</text>
</svg>
