<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc">
  <title id="title">Separate Umbra profiles</title>
  <desc id="desc">Research and work are example profiles. Each has its own agent, daemon, tabs, cookie store and downloads, so parallel agents do not change each other's state.</desc>
  <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#1b1730"/><stop offset="1" stop-color="#07060d"/></linearGradient></defs>
  <rect width="600" height="610" rx="24" fill="url(#sky)"/><rect x="1" y="1" width="598" height="608" rx="23" fill="none" stroke="#fff1d2" stroke-opacity=".14" stroke-width="2"/>
  <text x="32" y="57" fill="#f4efe6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600">One profile per identity</text>
  <text x="32" y="94" fill="#c3bdd3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23">Separate lanes for parallel agents.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(32 126)"><rect width="536" height="205" rx="16" fill="#f6b26b" fill-opacity=".055" stroke="#f6b26b" stroke-opacity=".5" stroke-width="2"/><text x="22" y="47" fill="#f6b26b" font-size="30" font-weight="600">research</text><path d="M22 70h492" stroke="#f6b26b" stroke-opacity=".3"/><text x="22" y="116" fill="#f4efe6" font-size="25">agent → daemon + tabs</text><text x="22" y="160" fill="#c3bdd3" font-size="24">own cookies and downloads</text></g>
    <g transform="translate(32 356)"><rect width="536" height="205" rx="16" fill="#c06bd6" fill-opacity=".055" stroke="#c06bd6" stroke-opacity=".5" stroke-width="2"/><text x="22" y="47" fill="#ddb0ee" font-size="30" font-weight="600">work</text><path d="M22 70h492" stroke="#c06bd6" stroke-opacity=".3"/><text x="22" y="116" fill="#f4efe6" font-size="25">agent → daemon + tabs</text><text x="22" y="160" fill="#c3bdd3" font-size="24">own cookies and downloads</text></g>
  </g>
  <text x="300" y="588" text-anchor="middle" fill="#c3bdd3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">Each lane keeps its own current tab</text>
</svg>
