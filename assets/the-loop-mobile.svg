<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 890" role="img" aria-labelledby="title desc">
  <title id="title">The Umbra loop</title>
  <desc id="desc">Open a page, read its snapshot, act on an element ref, then read the changed page. All commands use one persistent signed-in tab.</desc>
  <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#151c30"/><stop offset="1" stop-color="#080b14"/></linearGradient></defs>
  <rect width="600" height="890" rx="24" fill="url(#sky)"/><rect x="1" y="1" width="598" height="888" rx="23" fill="none" stroke="#e8edff" stroke-opacity=".14" stroke-width="2"/>
  <text x="32" y="57" fill="#f1f4fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600">One tab. One continuous loop.</text>
  <text x="32" y="94" fill="#c2cadd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23">Act on what the page just showed you.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(32 127)"><rect width="536" height="145" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#e8edff" stroke-opacity=".20"/><text x="22" y="39" fill="#93b4ff" font-size="21" font-weight="700">01 / OPEN</text><text x="22" y="84" fill="#f1f4fc" font-size="31" font-weight="600">Load the page</text><text x="22" y="119" fill="#c2cadd" font-size="23">Wait for navigation</text></g>
    <g transform="translate(32 299)"><rect width="536" height="145" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#e8edff" stroke-opacity=".20"/><text x="22" y="39" fill="#b5a1ff" font-size="21" font-weight="700">02 / SEE</text><text x="22" y="84" fill="#f1f4fc" font-size="31" font-weight="600">Read a snapshot</text><text x="22" y="119" fill="#c2cadd" font-size="23">Find an element ref</text></g>
    <g transform="translate(32 471)"><rect width="536" height="145" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#e8edff" stroke-opacity=".20"/><text x="22" y="39" fill="#87dced" font-size="21" font-weight="700">03 / ACT</text><text x="22" y="84" fill="#f1f4fc" font-size="31" font-weight="600">Click or fill</text><text x="22" y="119" fill="#c2cadd" font-size="23">Use native input</text></g>
    <g transform="translate(32 643)"><rect width="536" height="145" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#e8edff" stroke-opacity=".20"/><text x="22" y="39" fill="#93b4ff" font-size="21" font-weight="700">04 / SEE AGAIN</text><text x="22" y="84" fill="#f1f4fc" font-size="31" font-weight="600">Read the result</text><text x="22" y="119" fill="#c2cadd" font-size="23">Fresh page, fresh refs</text></g>
  </g>
  <g stroke="#93b4ff" stroke-width="3" fill="#93b4ff"><path d="M300 276v17m0 155v17m0 155v17"/><path d="m300 293-5-9h10zm0 172-5-9h10zm0 172-5-9h10z"/></g>
  <text x="300" y="844" text-anchor="middle" fill="#c2cadd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22">The signed-in tab persists between commands</text>
</svg>
