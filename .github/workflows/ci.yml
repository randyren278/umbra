name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The tests load real pages in WebKit, which needs a logged-in GUI session even off screen.
    # GitHub's hosted macOS runners have one (the runner user is logged in to Aqua); a self-hosted
    # runner started as a launch daemon or over plain SSH does not, and its WebKit runs fail.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest stable Xcode
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcrun swiftc --version

      - run: make build

      # Daemons the tests start exit after 60 idle seconds instead of 15 minutes. Nobody works at
      # this Mac, so the sign-in and handoff windows show for real (UMBRA_TEST_GUI=1).
      - run: make test
        env:
          UMBRA_IDLE: 60
          UMBRA_TEST_GUI: 1

      - name: WebKit diagnostics
        if: failure()
        run: |
          log show --last 20m --style compact --predicate 'process == "umbra" OR process CONTAINS "com.apple.WebKit"' 2>/dev/null | grep -iE 'error|fail|crash|terminat|jetsam|timeout' | tail -150 || true
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -iE 'umbra|WebKit' || echo 'no crash reports'

      - name: Stop test daemons
        if: always()
        run: |
          pgrep -fl 'Umbra.app/Contents/MacOS/umbra serve' || echo 'no daemons running'
          pkill -f 'Umbra.app/Contents/MacOS/umbra serve' || true

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Info.plist version $version"
            exit 1
          fi
          make release

      - name: Upload dist
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Re-running the workflow for a tag replaces the assets instead of failing.
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Umbra $TAG" --generate-notes
          fi
