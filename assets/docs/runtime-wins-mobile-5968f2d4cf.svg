ystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#b5a1ff" data-max-width="480">82%–84%</text><text x="60" y="636" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#f1f4fc" data-max-width="480">Less sampled peak memory</text><text x="60" y="698" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c2cadd" data-max-width="480">Daemon + responsible helpers</text><text x="36" y="778" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#c2cadd" data-max-width="528">All measured tasks and warmups</text><text x="36" y="810" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#c2cadd" data-max-width="528">succeeded in each pair. Whole-grid</text><text x="36" y="842" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#c2cadd" data-max-width="528">targets remain unmet; heavy matched</text><text x="36" y="874" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#c2cadd" data-max-width="528">runs hit the RAM guard.</text>
