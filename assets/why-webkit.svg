<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Why native WebKit</title>
  <desc id="desc">Three properties of Umbra's native WebKit tabs: pages report visible and keep animation frames running; native input arrives as trusted events; the off-screen browser does not take focus.</desc>
  <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#151c30"/><stop offset="1" stop-color="#080b14"/></linearGradient></defs>
  <rect width="1200" height="430" rx="28" fill="url(#sky)"/><rect x="1" y="1" width="1198" height="428" rx="27" fill="none" stroke="#e8edff" stroke-opacity=".14" stroke-width="2"/>
  <text x="48" y="70" fill="#f1f4fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600">A browser that behaves like an open tab</text>
  <text x="48" y="111" fill="#c2cadd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25">WebKit is native to the Mac; Umbra keeps it out of your way.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(48 150)"><rect width="350" height="232" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#e8edff" stroke-opacity=".20"/><circle cx="43" cy="43" r="18" fill="#93b4ff" fill-opacity=".18" stroke="#93b4ff" stroke-width="2"/><circle cx="43" cy="43" r="7" fill="#93b4ff"/><text x="76" y="52" fill="#f1f4fc" font-size="28" font-weight="600">Visible to the page</text><text x="24" y="113" fill="#c2cadd" font-size="24">Animation frames and lazy</text><text x="24" y="147" fill="#c2cadd" font-size="24">loading keep running.</text><text x="24" y="201" fill="#93b4ff" font-size="22">visibilityState: visible</text></g>
    <g transform="translate(425 150)"><rect width="350" height="232" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#e8edff" stroke-opacity=".20"/><circle cx="43" cy="43" r="18" fill="#87dced" fill-opacity=".18" stroke="#87dced" stroke-width="2"/><path d="m35 43 6 6 11-13" fill="none" stroke="#87dced" stroke-width="3"/><text x="76" y="52" fill="#f1f4fc" font-size="28" font-weight="600">Trusted input</text><text x="24" y="113" fill="#c2cadd" font-size="24">Native clicks, keys and</text><text x="24" y="147" fill="#c2cadd" font-size="24">scrolls reach the view.</text><text x="24" y="201" fill="#87dced" font-size="22">isTrusted: true</text></g>
    <g transform="translate(802 150)"><rect width="350" height="232" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#e8edff" stroke-opacity=".20"/><circle cx="43" cy="43" r="18" fill="#b5a1ff" fill-opacity=".18" stroke="#b5a1ff" stroke-width="2"/><circle cx="43" cy="43" r="8" fill="none" stroke="#b5a1ff" stroke-width="2"/><text x="76" y="52" fill="#f1f4fc" font-size="28" font-weight="600">Your focus stays</text><text x="24" y="113" fill="#c2cadd" font-size="24">Off-screen tabs have no</text><text x="24" y="147" fill="#c2cadd" font-size="24">Dock or desktop presence.</text><text x="24" y="201" fill="#b5a1ff" font-size="22">Windows only for human steps</text></g>
  </g>
</svg>
