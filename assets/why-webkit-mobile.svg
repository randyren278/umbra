<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 786" role="img" aria-labelledby="title desc">
  <title id="title">Why native WebKit</title>
  <desc id="desc">Native WebKit tabs keep page scripts active, send trusted input, and leave the Mac's focus alone.</desc>
  <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#1b1730"/><stop offset="1" stop-color="#07060d"/></linearGradient></defs>
  <rect width="600" height="786" rx="24" fill="url(#sky)"/><rect x="1" y="1" width="598" height="784" rx="23" fill="none" stroke="#fff1d2" stroke-opacity=".14" stroke-width="2"/>
  <text x="32" y="57" fill="#f4efe6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Like an open tab, out of your way</text>
  <text x="32" y="94" fill="#c3bdd3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23">Three properties of native WebKit.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(32 126)"><rect width="536" height="190" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#f6b26b" stroke-opacity=".45"/><text x="22" y="44" fill="#f6b26b" font-size="29" font-weight="600">Visible to the page</text><text x="22" y="92" fill="#c3bdd3" font-size="24">Animation frames and lazy loading</text><text x="22" y="128" fill="#c3bdd3" font-size="24">keep running.</text><text x="22" y="165" fill="#f6b26b" font-size="22">visibilityState: visible</text></g>
    <g transform="translate(32 341)"><rect width="536" height="190" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#5fd38d" stroke-opacity=".45"/><text x="22" y="44" fill="#5fd38d" font-size="29" font-weight="600">Trusted input</text><text x="22" y="92" fill="#c3bdd3" font-size="24">Native clicks, keys and scrolls</text><text x="22" y="128" fill="#c3bdd3" font-size="24">reach the view.</text><text x="22" y="165" fill="#5fd38d" font-size="22">isTrusted: true</text></g>
    <g transform="translate(32 556)"><rect width="536" height="190" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#c06bd6" stroke-opacity=".45"/><text x="22" y="44" fill="#ddb0ee" font-size="29" font-weight="600">Your focus stays</text><text x="22" y="92" fill="#c3bdd3" font-size="24">Off-screen tabs have no Dock</text><text x="22" y="128" fill="#c3bdd3" font-size="24">or desktop presence.</text><text x="22" y="165" fill="#ddb0ee" font-size="22">Windows only for human steps</text></g>
  </g>
</svg>
