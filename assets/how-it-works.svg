<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" width="1200" height="890" role="img" aria-labelledby="title desc">
  <title id="title">How Umbra works</title>
  <desc id="desc">The umbra CLI and the umbra mcp server are both clients of one daemon per profile, which they reach over a unix socket and start on first use. The daemon owns the tabs: WebKit views in off-screen windows that pages see as visible, driven with trusted native input. The tabs share Umbra's own cookie store on disk, filled once by umbra sign-in; sign-in and handoff are the only windows, shown when the person is needed. Safari and the screen are untouched: no Dock icon, no focus taken, no shared cookies.</desc>
