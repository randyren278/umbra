  <text x="76" y="732" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">WebKit, off screen</text><text x="76" y="768" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">pages report visible</text><text x="76" y="804" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">trusted native input</text>
