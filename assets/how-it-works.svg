  <text x="850" y="486" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">Umbra's own, on disk</text><text x="850" y="522" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">one per profile</text><text x="850" y="558" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">values never printed</text>
