<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" width="1200" height="608" role="img" aria-labelledby="title desc">
  <title id="title">How Umbra works</title>
  <desc id="desc">Your script or agent runs the umbra command and gets back text, JSON or a file plus an exit code. umbra takes the profile's lock and drives WebKit off screen, with no window or Dock icon. WebKit presents Safari's user agent, runs your JavaScript, fetches and downloads, using Umbra's own cookie store on disk. umbra sign-in fills that store once, in one window with a check per site. Safari is untouched: no tabs, no focus taken, no shared cookies.</desc>
