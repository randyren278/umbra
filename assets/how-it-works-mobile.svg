  <text x="76" y="1260" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">a window only when</text><text x="76" y="1296" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">you're needed</text>
  <rect x="48" y="1410" width="504" height="176" rx="18" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="7 7" stroke-opacity="0.22"/>
  <rect x="48" y="1436" width="5" height="34" rx="2.5" fill="#9a93b3"/>
  <text x="76" y="1464" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#f4efe6">Your screen, untouched</text>
  <text x="76" y="1506" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">no focus taken, no shared cookies</text><text x="76" y="1542" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">no Dock icon while it works</text>
