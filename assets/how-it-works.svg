    <stop offset="0.70" stop-color="#f6b26b" stop-opacity="0.7"/>
    <stop offset="0.82" stop-color="#c06bd6" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#7c5cf6" stop-opacity="0"/>
