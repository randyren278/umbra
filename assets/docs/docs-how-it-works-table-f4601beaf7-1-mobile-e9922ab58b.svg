e UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f4fc" data-max-width="488">90 s</text><rect x="36" y="528" width="528" height="168" rx="14" fill="#121a2c" stroke="#2b3852"/><text x="56" y="566" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#93b4ff" data-max-width="488">download</text><text x="56" y="610" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#98a5bf" data-max-width="488">DEFAULT --TIMEOUT</text><text x="56" y="638" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f4fc" data-max-width="488">300 s</text><text x="36" y="736" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#c2cadd" data-max-width="528">Copyable values and source links are below.</text>
