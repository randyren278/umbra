<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 445" width="600" height="445" role="img" aria-labelledby="title desc">
  <title id="title">MiniWoB++: external agent tasks</title>
  <desc id="desc">All 125 task types, five upstream seed repetitions and both browser arms: 1,250 primary episodes. Umbra earned full reward on 517/625 (82.7%), compared with 489/625 (78.2%) for Playwright MCP.</desc>
  <defs>
  <radialGradient id="corona" cx="0" cy="0" r="230" gradientUnits="userSpaceOnUse">
    <stop offset="0.60" stop-color="#dce7ff" stop-opacity="0"/>
    <stop offset="0.655" stop-color="#e8edff" stop-opacity="1"/>
    <stop offset="0.70" stop-color="#93b4ff" stop-opacity="0.7"/>
    <stop offset="0.82" stop-color="#b5a1ff" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#7c83f6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rays" cx="0" cy="0" r="262" gradientUnits="userSpaceOnUse">
    <stop offset="0.56" stop-color="#e8edff" stop-opacity="0.75"/>
    <stop offset="0.72" stop-color="#93b4ff" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#b5a1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moon" cx="-40" cy="-50" r="190" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#192039"/>
    <stop offset="1" stop-color="#080b14"/>
  </radialGradient>
  <radialGradient id="bead" cx="0" cy="0" r="46" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.18" stop-color="#edf3ff"/>
    <stop offset="0.45" stop-color="#bbceff" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#93b4ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7c83f6" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#7c83f6" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="2.6"/>
  </filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#151c30"/>
    <stop offset="1" stop-color="#080b14"/>
  </linearGradient>
  </defs><rect width="600" height="445" rx="28" fill="url(#sky)"/><rect x="0.75" y="0.75" width="598.5" height="443.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/><text x="36" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#93b4ff" data-max-width="528">MiniWoB++: external agent</text><text x="36" y="106" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" fill="#93b4ff" data-max-width="528">tasks</text><text x="36" y="164" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">All 125 task types, five upstream</text><text x="36" y="199" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">seed repetitions and both browser</text><text x="36" y="234" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">arms: 1,250 primary episodes.</text><text x="36" y="269" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">Umbra earned full reward on</text><text x="36" y="304" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">517/625 (82.7%), compared with</text><text x="36" y="339" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">489/625 (78.2%) for Playwright</text><text x="36" y="374" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#f1f4fc" data-max-width="528">MCP.</text>
</svg>
