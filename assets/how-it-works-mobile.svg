  <text x="76" y="1014" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">Umbra's own, on disk</text><text x="76" y="1050" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3bdd3">values never printed</text>
  <rect x="48" y="1164" width="504" height="176" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.16"/>
  <rect x="48" y="1190" width="5" height="34" rx="2.5" fill="#5fd38d"/>
