<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 353" width="1200" height="353" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark</title>
  <desc id="desc">Metric: /heavy, with and without images, Umbra: open /heavy, then block images, Playwright: goto(&#x27;/heavy&#x27;), then route() aborting image URLs</desc>
  <defs>
  <radialGradient id="corona" cx="0" cy="0" r="230" gradientUnits="userSpaceOnUse">
