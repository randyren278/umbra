<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 784" role="img" aria-labelledby="title desc">
  <title id="title">Sign-in and handoff</title>
  <desc id="desc">You sign in through a visible window. The agent uses that profile in an off-screen tab. Handoff shows the agent's tab for a human step, then hides it again.</desc>
  <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#151c30"/><stop offset="1" stop-color="#080b14"/></linearGradient></defs>
  <rect width="600" height="784" rx="24" fill="url(#sky)"/><rect x="1" y="1" width="598" height="782" rx="23" fill="none" stroke="#e8edff" stroke-opacity=".14" stroke-width="2"/>
  <text x="32" y="57" fill="#f1f4fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600">A human enters when needed</text>
  <text x="32" y="94" fill="#c2cadd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23">The profile keeps your sign-in.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(32 125)"><rect width="536" height="178" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#93b4ff" stroke-opacity=".55" stroke-width="2"/><text x="22" y="46" fill="#93b4ff" font-size="29" font-weight="600">01 / Sign in once</text><text x="22" y="99" fill="#c2cadd" font-size="24">You enter credentials in a</text><text x="22" y="135" fill="#c2cadd" font-size="24">visible window.</text></g>
    <g transform="translate(32 333)"><rect width="536" height="178" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#b5a1ff" stroke-opacity=".55" stroke-width="2"/><text x="22" y="46" fill="#d0c6ff" font-size="29" font-weight="600">02 / Agent works</text><text x="22" y="99" fill="#c2cadd" font-size="24">The signed-in tab stays</text><text x="22" y="135" fill="#c2cadd" font-size="24">off screen.</text></g>
    <g transform="translate(32 541)"><rect width="536" height="178" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#87dced" stroke-opacity=".55" stroke-width="2"/><text x="22" y="46" fill="#87dced" font-size="29" font-weight="600">03 / Handoff</text><text x="22" y="99" fill="#c2cadd" font-size="24">You handle 2FA or a challenge;</text><text x="22" y="135" fill="#c2cadd" font-size="24">the tab hides again.</text></g>
  </g>
  <g stroke="#93b4ff" stroke-width="3" fill="#93b4ff"><path d="M300 307v19m0 189v19"/><path d="m300 326-5-9h10zm0 208-5-9h10z"/></g>
  <text x="300" y="755" text-anchor="middle" fill="#c2cadd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22">Handoff preserves the agent's tab</text>
</svg>
